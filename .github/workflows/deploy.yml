name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Rebuild every 12 hours to auto-sync new Nostr articles
    - cron: '0 */12 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compute GitHub Pages URL
        id: pages-url
        shell: bash
        run: |
          REPO="${{ github.repository }}"
          OWNER="${REPO%/*}"
          REPO_NAME="${REPO#*/}"
          # Query the Pages API for the custom domain (cname) set in Pages settings
          PAGES_JSON="$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${REPO}/pages")"
          CNAME="$(echo "$PAGES_JSON" | jq -r '.cname // empty')"
          HTML_URL="$(echo "$PAGES_JSON" | jq -r '.html_url // empty')"
          if [ -n "$CNAME" ]; then
            # Custom domain set in Pages settings
            URL="https://${CNAME}/"
          elif [ -n "$HTML_URL" ]; then
            URL="$HTML_URL"
          elif [ "$REPO_NAME" = "${OWNER}.github.io" ]; then
            # User/org site: https://<owner>.github.io/
            URL="https://${OWNER}.github.io/"
          else
            # Project site: https://<owner>.github.io/<repo>/
            URL="https://${OWNER}.github.io/${REPO_NAME}/"
          fi
          # Edge case: normalize http -> https
          URL="${URL/http:\/\//https:\/\/}"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Computed GitHub Pages URL: ${URL}"

      - name: Build static blog
        env:
          NPUB: ${{ secrets.NPUB || vars.NPUB }}
          SITE_URL: ${{ secrets.SITE_URL || vars.SITE_URL || steps.pages-url.outputs.url }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
